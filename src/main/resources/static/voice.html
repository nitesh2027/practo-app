<!DOCTYPE html>
<html>

<head>

    <title>AI Voice Assistant</title>

    <style>

        body {

            font-family: Arial;
            text-align: center;
            margin-top: 100px;
        }

        button {

            padding: 15px 30px;
            font-size: 18px;
            cursor: pointer;
        }

        h2 {

            color: blue;
        }

    </style>

</head>

<body>

<h2>🎤 AI Medical Voice Assistant</h2>

<button onclick="startVoice()">

    Start Speaking

</button>

<br><br>

<h3 id="question"></h3>

<h3 id="answer"></h3>

<script>

    function startVoice() {

        const recognition =
            new webkitSpeechRecognition();

        recognition.lang = "en-US";

        recognition.start();

        recognition.onresult =
            function(event) {

            let text =
                event.results[0][0].transcript;

            document.getElementById("question")
                .innerHTML =
                "You Said: " + text;

            fetch(

                "http://localhost:8080/voice-ai/ask",

                {

                    method: "POST",

                    headers: {

                        "Content-Type":
                        "application/json"
                    },

                    body: JSON.stringify({

                        question: text
                    })
                }
            )

            .then(response => response.json())

            .then(data => {

                document.getElementById("answer")
                    .innerHTML =
                    "AI Response: "
                    + data.answer;

                speechSynthesis.speak(

                    new SpeechSynthesisUtterance(
                        data.answer
                    )
                );

            });

        };
    }

</script>

</body>

</html>
