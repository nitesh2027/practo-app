spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/Practo_db
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update

    show-sql: true

    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

springdoc:
  api-docs:
    enabled: true
    path: /v3/api-docs

  swagger-ui:
    enabled: true
    path: /swagger-ui.html

twilio:
  account:
    sid: dummy_sid

  auth:
    token: dummy_token

  phone:
    number: +10000000000

  whatsapp:
    number: whatsapp:+10000000000

sendgrid:
  api:
    key: dummy_sendgrid_key

groq:
  api:
    key: dummy_groq_key

razorpay:
  key:
    id: dummy_razorpay_key
    secret: dummy_razorpay_secret

server:
  port: 8080